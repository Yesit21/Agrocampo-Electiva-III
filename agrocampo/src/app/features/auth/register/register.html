<div class="auth-container">

  <!-- IMAGEN IZQUIERDA CON LOGOTIPO ENCIMA -->
  <section class="auth-image-panel register-image">
    <a routerLink="/registro" class="image-brand">
      <span>🌱</span>
      <span>AGROCAMPO</span>
    </a>
  </section>

  <!-- FORMULARIO A LA DERECHA -->
  <section class="auth-form-section">
    <div class="auth-form-wrapper">

      <div class="auth-heading">
        <h1>Crear una cuenta</h1>
        <p>Regístrate para comenzar a gestionar tus cultivos.</p>
      </div>

      <form (ngSubmit)="registrarUsuario()" #registerForm="ngForm">

        <div class="auth-field">
          <label for="nombre">Nombre completo</label>
          <input id="nombre" type="text" name="nombre"
            [(ngModel)]="nombre" placeholder="Ingresa tu nombre"
            autocomplete="name" required minlength="3">
        </div>

        <div class="auth-field">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" name="email"
            [(ngModel)]="email" placeholder="ejemplo@correo.com"
            autocomplete="email" required>
        </div>

        <div class="auth-field">
          <label for="telefono">Teléfono</label>
          <input id="telefono" type="tel" name="telefono"
            [(ngModel)]="telefono" placeholder="Número de contacto"
            autocomplete="tel" required>
        </div>

        <div class="auth-field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password"
            [(ngModel)]="password" placeholder="Mínimo 8 caracteres"
            autocomplete="new-password" minlength="8" required>
        </div>

        <div class="auth-field">
          <label for="confirmarPassword">Confirmar contraseña</label>
          <input id="confirmarPassword" type="password"
            name="confirmarPassword" [(ngModel)]="confirmarPassword"
            placeholder="Repite tu contraseña" required>
        </div>

        <button type="submit" class="auth-button"
          [disabled]="registerForm.invalid">
          Crear cuenta
        </button>

      </form>

      <p class="auth-switch">
        ¿Ya tienes una cuenta?
        <a routerLink="/login">Iniciar sesión</a>
      </p>

    </div>
  </section>

</div>
